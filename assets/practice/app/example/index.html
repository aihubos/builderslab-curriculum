<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 할 일 · 교육용 완성 예시</title><link rel="stylesheet" href="style.css"><script src="app.js?v=2" defer></script></head><body><main><p class="eyebrow">BUILDERS LAB / 실습용 완성 예시</p><h1>오늘의 작은 한 걸음.</h1><p>직접 추가하고, 완료하고, 다시 열어보세요.</p><form id="add-form"><label for="task">할 일</label><div class="input-row"><input id="task" name="task" autocomplete="off" placeholder="오늘 할 일 한 가지 (120자 이내)"><button type="submit">추가</button></div></form><p id="status" role="status" aria-live="polite"></p><div class="summary"><strong id="remaining">남은 할 일 0개</strong><span>교육용 예제</span></div><ul id="tasks"></ul><p id="empty">아직 할 일이 없어요. 한 가지를 추가해보세요.</p><footer>이 예제는 같은 브라우저·같은 주소에만 저장됩니다.<br>다른 기기와 동기화되지 않으며 브라우저 데이터를 지우면 사라집니다.</footer><noscript>JavaScript를 사용할 수 없어 앱이 작동하지 않습니다.</noscript></main></body></html>
